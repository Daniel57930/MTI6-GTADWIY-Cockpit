name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        if: hashFiles('package.json') != '' && contains(toJSON(fromJSON(hashFiles('package.json'))), 'lint')
        run: npm run lint --if-present
        continue-on-error: false
      
      - name: Run tests
        if: hashFiles('package.json') != '' && contains(toJSON(fromJSON(hashFiles('package.json'))), 'test')
        run: npm test --if-present
        continue-on-error: false
      
      - name: Build frontend
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci
      
      - name: Run server lint
        working-directory: ./server
        run: npm run lint --if-present
        continue-on-error: false
      
      - name: Run server tests
        working-directory: ./server
        run: npm test --if-present
        continue-on-error: false
      
      - name: Build server (if build script exists)
        working-directory: ./server
        run: npm run build --if-present
        continue-on-error: false
